name: Tests
on: [push, pull_request]
jobs:
  php:
    name: PHP ${{ matrix.php-versions }}, Guzzle ${{ matrix.guzzle-versions }}
    # Same-repo changes run on push; fork PRs run on pull_request.
    if: >-
      (github.event_name == 'push' && !github.event.pull_request.head.repo.fork) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        guzzle-versions:
          - '7'
        # Guzzle 8 on lowest and highest PHP only.
        include:
          - php-versions: '8.0'
            guzzle-versions: '8'
          - php-versions: '8.4'
            guzzle-versions: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: json
          coverage: xdebug
      - name: Install Composer dependencies
        run: |
          composer require -n --no-update guzzlehttp/guzzle:^${{ matrix.guzzle-versions }}
          composer update -n
      - name: Run Tests
        run: |
          export CLOUDINARY_URL=$(bash tools/get_test_cloud.sh);
          echo cloud_name: "$(echo $CLOUDINARY_URL | cut -d'@' -f2)"
          vendor/bin/simple-phpunit
